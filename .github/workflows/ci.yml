name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint with ruff
        run: ruff check src/ monitoring/ tests/ --output-format=github
        continue-on-error: true
      - name: Run consistency, drift, and batch tests
        run: pytest tests/test_consistency.py tests/test_drift.py tests/test_batch.py -v
  schema:
    name: Postgres schema integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: beam_monitoring
          POSTGRES_USER: beam_user
          POSTGRES_PASSWORD: beam_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy psycopg2-binary pytest
      - name: Run schema tests
        env:
          POSTGRES_URI: postgresql://beam_user:beam_pass@localhost:5432/beam_monitoring
        run: pytest tests/test_schema.py -v
  docker:
    name: Docker build and import smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: beam-project:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test - core modules import inside the image
        run: |
          docker run --rm beam-project:ci python -c "
          from src.prefect_train import training_pipeline, FEATURES, TARGETS
          from monitoring.monitor import monitoring_pipeline
          from monitoring.simulate_batch import make_batch
          print('Core modules imported successfully')
          print('FEATURES:', FEATURES)
          print('TARGETS:', TARGETS)

          import importlib.util
          spec = importlib.util.find_spec('src.app')
          assert spec is not None, 'src.app module not found'
          print('src.app module is locatable (full import requires runtime artifacts)')
          "
